syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "osac/private/v1/network_realization_type.proto";

option (cleanapi.file).private = true;

message NetworkRealizationsListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all the results will be returned. Note
  // that there may not be enough results to return, and that the server may decide, for performance reasons, to return
  // less results than requested.
  optional int32 limit = 2;

  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) expression used to select which objects to return. The
  // built-in `this` variable refers to the object being tested and `now` refers to the current date and time. If the
  // expression evaluates to `true` the object is included in the results. For example, to retrieve all realizations
  // at one site:
  //
  //     this.spec.site_id == "site-a"
  //
  // If this isn't provided, or if the value is empty, then all realizations that the user has permission to see
  // will be returned. Not all CEL constructs are currently supported for implementation reasons; see the filter
  // documentation (docs/FILTER.md) for the full details.
  optional string filter = 3;

  // Order criteria.
  //
  // The syntax of this parameter is similar to the syntax of the _order by_ clause of a SQL statement, but using the
  // names of the attributes of the realization instead of the names of the columns of a table. For example, in
  // order to sort realizations descending by name the value should be:
  //
  //     metadata.name desc
  //
  // If the parameter isn't provided, or if the value is empty, then the order of the results is undefined.
  optional string order = 4;
}

message NetworkRealizationsListResponse {
  // Actual number of items returned. Note that this may be smaller than the value requested in the `limit` parameter
  // of the request if there are not enough items, or if the system decides that returning that number of items isn't
  // feasible or convenient for performance reasons.
  int32 size = 1;

  // Total number of items of the collection that match the search criteria, regardless of the number of results
  // requested with the `limit` parameter.
  int32 total = 2;

  // List of results.
  repeated NetworkRealization items = 3;
}

message NetworkRealizationsGetRequest {
  string id = 1;
}

message NetworkRealizationsGetResponse {
  NetworkRealization object = 1;
}

message NetworkRealizationsCreateRequest {
  NetworkRealization object = 1;
}

message NetworkRealizationsCreateResponse {
  NetworkRealization object = 1;
}

message NetworkRealizationsUpdateRequest {
  NetworkRealization object = 1;
  google.protobuf.FieldMask update_mask = 2;

  // Lock enables optimistic locking. When set to true, the server verifies that the current version of the object
  // matches the value of the metadata.version field of the submitted object. If they differ the update will be
  // rejected. This is useful to prevent lost updates when multiple clients are modifying the same object concurrently.
  bool lock = 3;
}

message NetworkRealizationsUpdateResponse {
  NetworkRealization object = 1;
}

message NetworkRealizationsDeleteRequest {
  string id = 1;
}

message NetworkRealizationsDeleteResponse {}

message NetworkRealizationsSignalRequest {
  string id = 1;
}

message NetworkRealizationsSignalResponse {}

service NetworkRealizations {
  // Retrieves the list of network realizations.
  rpc List(NetworkRealizationsListRequest) returns (NetworkRealizationsListResponse) {
    option (google.api.http) = {get: "/api/private/v1/network_realizations"};
  }

  // Retrieves the details of one specific network realization.
  rpc Get(NetworkRealizationsGetRequest) returns (NetworkRealizationsGetResponse) {
    option (google.api.http) = {
      get: "/api/private/v1/network_realizations/{id}"
      response_body: "object"
    };
  }

  // Creates a durable network realization intent before calling the provider.
  rpc Create(NetworkRealizationsCreateRequest) returns (NetworkRealizationsCreateResponse) {
    option (google.api.http) = {
      post: "/api/private/v1/network_realizations"
      body: "object"
      response_body: "object"
    };
  }

  // Updates an existing network realization's observed status.
  rpc Update(NetworkRealizationsUpdateRequest) returns (NetworkRealizationsUpdateResponse) {
    option (google.api.http) = {
      patch: "/api/private/v1/network_realizations/{object.id}"
      body: "object"
      response_body: "object"
    };
  }

  // Deletes a network realization after provider cleanup (if OSAC-owned).
  rpc Delete(NetworkRealizationsDeleteRequest) returns (NetworkRealizationsDeleteResponse) {
    option (google.api.http) = {delete: "/api/private/v1/network_realizations/{id}"};
  }

  // Signal is required by the generic server infrastructure but is not implemented for NetworkRealization
  // (no reconciler). Calls return UNIMPLEMENTED.
  rpc Signal(NetworkRealizationsSignalRequest) returns (NetworkRealizationsSignalResponse) {
  }
}
